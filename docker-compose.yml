version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_octane_vue
    user: "${UID}:${GID}"
    volumes:
      - ./src:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - laravel_octane_vue_network-2

  db:
    image: mysql:8.0
    container_name: laravel_octane_vue_db
    # restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - laravel_octane_vue_network-2

  node:
    image: node:20
    container_name: laravel_octane_vue_node
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - laravel_octane_vue_network-2

networks:
  laravel_octane_vue_network-2:


volumes:
  db_data:
